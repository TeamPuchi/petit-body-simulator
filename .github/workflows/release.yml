name: Release by version

# main に push されたとき、index.html の <meta name="version"> を読み、
# その名前(v1.2.3)のタグが無ければ タグ + Release を作る。ページは GitHub Pages(main / root)がそのまま出す。
# 版を上げるときは template.html の <meta name="version"> と SIM_VERSION の両方を直して build.py を実行する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from index.html
        id: ver
        run: |
          V="$(sed -n 's/.*<meta name="version" content="\([^"]*\)".*/\1/p' index.html | head -1)"
          test -n "$V"
          J="$(sed -n 's/^const SIM_VERSION = "\([^"]*\)".*/\1/p' index.html | head -1)"
          if [ "$V" != "$J" ]; then echo "meta の版 ($V) と SIM_VERSION ($J) が違います"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V"

      - name: Tag + Release
        if: steps.ver.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
          gh release create "v$V" --title "Petit Body Simulator v$V" --notes "https://teampuchi.github.io/petit-body-simulator/ の版 v$V。ページの下に同じ版が出ます。" index.html
